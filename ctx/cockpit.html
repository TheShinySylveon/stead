<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ctx-token" content="__CTX_TOKEN__">
<meta name="description" content="Stead cockpit: local notes, tasks, repos and factory runs. Files stay the source of truth.">
<title>Stead</title>
<style>
  /* Hallmark · shape: app screen · genre: modern-minimal · theme: Console (deal 3/3, seed local-context-cockpit-one-b420·70b40c1d·2026-11-21·r0) · redesign: full
   * nav: sidebar, eight destinations, collapses under 60rem · signature: the needs-you trail · states: empty, error, full · console: graphite
   * axes: dark/grotesk-sans/chromatic-amber · posture: restrained · contrast: pass · v2.0.0 */
  /* Hallmark · pre-emit critique: P4 H4 E4 S3 R4 V4 · weakest: S, system faces stand in for the theme faces because this page is offline */
  /* Hallmark · dropped encodeURIComponent · before.json stored a split script line as a field and the fetch is unchanged */
  /* Hallmark · answered F7 · Console cuts panels and fields from one hairline surface, so a shared radius is the material */
  :root {
    color-scheme: dark;
    --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;

    --color-paper: oklch(17% 0.008 250); --color-paper-2: oklch(21% 0.009 250); --color-paper-3: oklch(13.5% 0.007 250);
    --color-ink: oklch(95% 0.005 250); --color-ink-2: oklch(83% 0.008 250); --color-muted: oklch(71% 0.01 250);
    --color-rule: oklch(31% 0.01 250); --color-rule-2: oklch(42% 0.012 250);
    --color-accent: oklch(82% 0.15 80); --color-accent-ink: oklch(18% 0.04 75); --color-accent-soft: oklch(29% 0.05 80); --color-focus: oklch(82% 0.15 80);
    --color-cool: oklch(77% 0.12 245); --color-cool-soft: oklch(29% 0.05 245);
    --color-ok: oklch(76% 0.15 150); --color-ok-soft: oklch(24.5% 0.03 150); --color-bad: oklch(70% 0.17 25); --color-bad-soft: oklch(24.5% 0.035 25);
    --color-nav: oklch(14.5% 0.008 250);

    --font-body: var(--font-display);

  html, body { margin: 0; height: 100%; overflow-x: clip; }

  .nav-foot { margin-top: auto; color: var(--color-muted); font-size: var(--text-xs); line-height: 1.45; }
  body.first-run aside.nav nav, body.first-run aside.nav .nav-foot, body.first-run .top { display: none; }
  body.first-run { grid-template-columns: 1fr; }

  .welcome {

  input[type="search"], input[type="text"], input[type="password"], input[type="number"], textarea, select {
    font: inherit; color: inherit; background: var(--color-paper-3);

  }
  input[type="search"] { width: 240px; }
  textarea { width: 100%; min-height: 88px; resize: vertical; }
  button.primary, button.quiet, button[type="submit"] {
    font: 500 var(--text-sm)/1.2 var(--font-body);
    border-radius: var(--radius-control); padding: var(--space-xs) var(--space-sm);

    transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out);

  button.primary, button.primary[type="submit"] {
    background: var(--color-accent); color: var(--color-accent-ink); border: var(--rule-hair) solid var(--color-accent);

  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  .stats, .grid, .board { display: grid; gap: var(--rule-hair); }
  .stats {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    margin-bottom: var(--space-lg);
    background: var(--color-rule);
    border: var(--rule-hair) solid var(--color-rule);

  .stat, .card, .panel {

  }
  .stat { padding: var(--space-md); border: 0; border-radius: 0; }
  .stat b {
    display: block; font: 400 var(--text-2xl)/1 var(--font-outlier);
    font-variant-numeric: tabular-nums slashed-zero; color: var(--color-ink);
  }
  .stat span { color: var(--color-muted); font-size: var(--text-sm); }
  .section-title {
    font: 500 var(--text-sm)/1.4 var(--font-body);

  }

  }
  .row, .card {
    display: flex; justify-content: space-between; gap: var(--space-sm); align-items: center;
    padding: var(--space-sm) var(--space-md); width: 100%; text-align: left;
  }
  button.row, button.card {
    appearance: none; font: inherit; color: inherit; cursor: pointer;
    border: var(--rule-hair) solid var(--color-rule);
    background: var(--color-paper-2); border-radius: var(--radius-card);
    transition: border-color var(--dur-micro) var(--ease-out);
  }
  button.row:hover, button.card:hover { border-color: var(--color-rule-2); }
  button.row:active, button.card:active { background: var(--color-paper-3); }
  .row small, .card small { color: var(--color-cool); font-family: var(--font-outlier); font-size: var(--text-xs); }
  .meta { color: var(--color-muted); font-size: var(--text-sm); }
  .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .chips { display: flex; gap: var(--space-2xs); flex-wrap: wrap; }
  .chip {
    font: 500 var(--text-xs)/1.4 var(--font-body);
    padding: var(--space-3xs) var(--space-xs); border-radius: var(--space-2xs);
    background: transparent; color: var(--color-muted); border: var(--rule-hair) solid var(--color-rule);
  }
  .chip.doing { background: var(--color-accent-soft); color: var(--color-accent); border-color: transparent; }
  .chip.blocked, .chip.fail { background: var(--color-bad-soft); color: var(--color-bad); border-color: transparent; }
  .chip.review, .chip.inbox { background: var(--color-cool-soft); color: var(--color-cool); border-color: transparent; }
  .chip.done, .chip.pass { background: var(--color-ok-soft); color: var(--color-ok); border-color: transparent; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-sm); }
  .home-split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.8fr); gap: var(--space-lg); align-items: start; }
  .board { grid-template-columns: repeat(4, minmax(180px, 1fr)); align-items: start; gap: var(--space-sm); }
  .col { background: transparent; }
  .col h3 { margin: 0 0 var(--space-xs); font-size: var(--text-sm); font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--color-muted); }
  .col.doing h3 { color: var(--color-accent); }
  .col.done h3 { color: var(--color-ok); }
  .col.blocked h3 { color: var(--color-bad); }
  button.linkish {
    appearance: none; border: 0; background: none; padding: 0; font: inherit;
    font-weight: 500; color: inherit; cursor: pointer; text-align: left;
  }
  button.linkish:hover { color: var(--color-accent); }
  .col .card { display: block; margin-bottom: var(--space-xs); }
  .card select, .row select { max-width: 140px; }
  form.stack { display: grid; gap: var(--space-xs); margin-bottom: var(--space-md); }
  form.inline { display: flex; gap: var(--space-xs); flex-wrap: wrap; align-items: center; margin-bottom: var(--space-md); }
  .empty {
    color: var(--color-muted); padding: var(--space-md);
    border: var(--rule-hair) dashed var(--color-rule); border-radius: var(--radius-card);
  }
  #reader {
    position: fixed; inset: 0 0 0 auto; width: min(640px, 100%);
    background: var(--color-paper-2); border-left: var(--rule-hair) solid var(--color-rule);
    padding: var(--space-lg) var(--space-lg) var(--space-xl); overflow: auto; z-index: 5;
  }
  #reader[hidden] { display: none; }
  #reader h3 { font-size: var(--text-xl); margin: var(--space-xs) 0; }
  .reader-body h1, .reader-body h2, .reader-body h3 { font-family: var(--font-display); line-height: 1.25; }
  .reader-body pre {
    background: var(--color-paper-3); color: var(--color-ink); padding: var(--space-sm);
    border-radius: var(--radius-card); border: var(--rule-hair) solid var(--color-rule); overflow: auto;
  }
  .reader-body code {
    font-family: var(--font-outlier); font-size: 0.9em;
    background: var(--color-paper-3); padding: 0 var(--space-2xs); border-radius: var(--space-2xs);
  }
  .reader-body p { margin: 0.6em 0; }
  .banner {
    background: var(--color-accent-soft); color: var(--color-accent); border-radius: var(--radius-control);
    padding: var(--space-xs) var(--space-sm); font-size: var(--text-sm); margin: var(--space-xs) 0 var(--space-sm);
  }
  #toast {
    position: fixed; bottom: var(--space-md); left: 0; right: 0; margin-inline: auto; width: max-content; max-width: calc(100% - var(--space-xl));
    background: var(--color-paper-3); color: var(--color-ink);
    border: var(--rule-hair) solid var(--color-rule-2);
    padding: var(--space-xs) var(--space-md); border-radius: var(--radius-control);
    font-size: var(--text-sm); z-index: 6;
  }
  #toast[hidden] { display: none; }
  a { color: var(--color-accent); text-underline-offset: 0.16em; }
  ::selection { background: color-mix(in oklab, var(--color-accent) 25%, transparent); }
  @media (max-width: 68rem) {
    .home-split { grid-template-columns: 1fr; }
  }
  @media (max-width: 60rem) {
    body { grid-template-columns: 1fr; }
    aside.nav { position: static; height: auto; }
    nav { flex-direction: row; flex-wrap: wrap; }

    main { padding: var(--space-md) var(--space-md) var(--space-2xl); }

  }
  @media (prefers-reduced-motion: reduce) {

  }
</style>
</head>
<body>
<aside class="nav">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1>Stead</h1>
      <p>Local context</p>
    </div>
  </div>
  <nav id="nav" aria-label="Sections"></nav>
  <p class="nav-foot">Loopback only. Files are the source of truth. Nothing here calls a model or writes to GitHub.</p>
</aside>
<main>
  <div class="top">
    <div>
      <h2 id="title">Home</h2>
      <p id="subtitle"></p>
    </div>
    <input id="q" type="search" placeholder="Filter this view" aria-label="Filter this view">
  </div>
  <div id="main"></div>
</main>
<aside id="reader" hidden></aside>
<div id="toast" hidden role="status"></div>
<script>
const TOKEN = document.querySelector('meta[name="ctx-token"]').content;
const VIEWS = [
  ["home", "Home"],
  ["tasks", "Tasks"],
  ["projects", "Projects"],
  ["library", "Library"],
  ["repos", "Repos"],
  ["inbox", "Inbox"],
  ["factories", "Factories"],
  ["settings", "Settings"],
];
const TITLES = {
  home: ["Home", "What needs you, across projects and contributions."],
  tasks: ["Tasks", "Move work by status. The file and the index update together."],
  projects: ["Projects", "Onboard a project with its repo and constitution, or add a project on its own."],
  library: ["Library", "Private notes and meetings. Read them, or edit the note and save."],
  repos: ["Repos", "Own projects and OSS. Sync is read-only. Contribution files stay public."],
  inbox: ["Inbox", "Unsorted capture. File it into a document, meeting, or task, or delete it."],
  factories: ["Factories", "Assemble a shadow bundle. A person or an agent still has to write the output."],
  settings: ["Settings", "This computer, a shared server, the model, and how far the software factory may go."],
};
const state = { snap: null, view: "home", q: "", onboardResult: null };

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function chip(text, tone) {
  return `<span class="chip ${esc(tone || "")}">${esc(text)}</span>`;
}
function match(item) {
  if (!state.q) return true;
  const hay = [item.title, item.id, item.name, item.status, item.state, item.kind]
    .filter(Boolean).join(" ").toLowerCase();
  return hay.includes(state.q);
}
function options(values, selected) {
  return values.map(v => `<option${v === selected ? " selected" : ""}>${esc(v)}</option>`).join("");
}
function toast(message) {
  const el = document.getElementById("toast");
  el.hidden = false;
  el.textContent = message;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 2400);
}
async function api(path, opts) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "X-Ctx-Token": TOKEN,
      ...(opts && opts.headers),
    },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
async function load() {
  state.snap = await api("/api/snapshot");
  render();
}
function projectName(id) {
  const p = (state.snap.projects || []).find(x => x.id === id);
  return p ? p.title : (id || "—");
}

function navBadge(id) {
  const c = state.snap.counts || {};
  const n = { home: c.attention, tasks: c.open_tasks, inbox: c.inbox, factories: c.pending_runs }[id];
  return n ? `<span class="badge">${esc(n)}</span>` : "";
}
function renderNav() {
  document.getElementById("nav").innerHTML = VIEWS.map(([id, label]) =>
    `<button type="button" data-nav="${id}" ${state.view === id ? 'aria-current="page"' : ""}><span>${label}</span>${navBadge(id)}</button>`
  ).join("");
  const [title, sub] = TITLES[state.view];
  document.getElementById("title").textContent = title;
  document.getElementById("subtitle").textContent = sub;
}

function renderHome() {
  const s = state.snap;
  const stats = [
    [s.counts.open_tasks, "Open tasks"],
    [s.counts.attention, "Need attention"],
    [s.counts.inbox, "Inbox"],
    [s.counts.pending_runs, "Pending runs"],
  ];
  const attention = s.attention.filter(match);
  const projects = s.projects.filter(match);
  const runs = (s.runs || []).filter(r => match({title: r.factory, id: r.task_ref, status: r.verdict})).slice(0, 6);
  const runRows = runs.map(r => `
    <div class="card" style="display:block">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
        <div><strong>${esc(r.factory)}</strong><div class="meta">${esc(r.task_ref)} · ${esc(r.prompt_version)} · ${esc(r.mode)}</div></div>
        ${chip(r.verdict, r.verdict === "approved" || r.verdict === "pass" ? "done" : r.verdict === "rejected" || r.verdict === "fail" ? "fail" : "doing")}
      </div>
      <div class="meta clip" style="margin-top:6px" title="${esc(r.bundle_path || "")}">${esc(r.created)}${r.bundle_path ? " · " + esc(r.bundle_path) : ""}</div>
      ${r.verdict === "pending" ? `<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="text" data-run-note="${esc(r.id)}" placeholder="Review note (optional)" aria-label="Review note for run ${esc(r.id)}">
        <button type="button" class="primary" data-verdict="approved" data-run="${esc(r.id)}">Approve</button>
        <button type="button" class="quiet" data-verdict="rejected" data-run="${esc(r.id)}">Reject</button>
      </div>` : ""}
    </div>`).join("");
  return `
    <div class="stats">${stats.map(([n, label]) => `<div class="stat"><b>${esc(n)}</b><span>${esc(label)}</span></div>`).join("")}</div>
    <div class="home-split">
      <section>
        <div class="section-title">Needs you</div>
        ${attention.length ? `<div class="list">${attention.map(item => `
          <button type="button" class="row" data-open data-type="${esc(item.type)}" data-id="${esc(item.id)}">
            <span><strong>${esc(item.title)}</strong><br><small>${esc(item.type)} · ${esc(item.id)}</small></span>
            ${chip(item.label, item.tone)}
          </button>`).join("")}</div>` : `<div class="empty">Nothing waiting. Capture a note, or enjoy the quiet.</div>`}
      </section>
      <section>
        <div class="section-title">Projects</div>
        <div class="list">${projects.map(projectCard).join("") || `<div class="empty">No projects yet.</div>`}</div>
        <div class="section-title">Recent runs</div>
        ${runRows || `<div class="empty">No factory runs yet.</div>`}
      </section>
    </div>`;
}
function projectOptions(selected) {
  const blank = selected === undefined ? `<option value="">No project</option>` : "";
  return blank + state.snap.projects.map(p =>
    `<option value="${esc(p.id)}"${p.id === selected ? " selected" : ""}>${esc(p.title)}</option>`).join("");
}
function projectCard(p) {
  const c = p.counts || {};

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMarkdown(src) {
  const fences = [];
  const text = String(src || "").replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => {
    fences.push("<pre><code>" + esc(code.replace(/^\n|\n$/g, "")) + "</code></pre>");
    return "\u0000" + (fences.length - 1) + "\u0000";
  });
  let html = "";
  for (const block of text.split(/\n{2,}/)) {
    const lines = block.split("\n").filter(line => line.trim());
    if (!lines.length) continue;
    const fence = lines[0].match(/^\u0000(\d+)\u0000$/);
    if (fence && lines.length === 1) { html += fences[+fence[1]]; continue; }
    const heading = lines[0].match(/^(#{1,3}) (.+)$/);
    if (heading && lines.length === 1) {
      const n = heading[1].length;
      html += `<h${n}>${inline(heading[2])}</h${n}>`;
      continue;
    }
    const items = lines.map(line => line.match(/^\s*[-*] \[[ xX]\] (.+)$/) || line.match(/^\s*[-*] (.+)$/));
    if (items.every(Boolean)) {
      html += "<ul>" + items.map(item => "<li>" + inline(item[1]) + "</li>").join("") + "</ul>";
      continue;
    }
    html += "<p>" + inline(lines.join(" ")) + "</p>";
  }
  return html;
}
async function openReader(type, id) {
  const panel = document.getElementById("reader");
  panel.hidden = false;
  panel.innerHTML = `<button type="button" class="quiet" id="close-reader">Close</button><p class="meta">Loading…</p>`;
  try {
    const data = type === "inbox"
      ? await api("/api/inbox?name=" + encodeURIComponent(id))
      : await api("/api/object?type=" + encodeURIComponent(type) + "&id=" + encodeURIComponent(id));
    const title = data.title || data.name;
    let body = data.body || "";
    const dup = body.match(/^#\s+(.+)\n+/);
    if (dup && dup[1].trim() === String(title).trim()) body = body.slice(dup[0].length);
    const banner = type === "contribution"
      ? `<div class="banner">Public GitHub cache. Private strategy belongs in a document, not here.</div>` : "";
    const editable = ["project", "task", "document", "meeting"].includes(type);
    const editor = editable ? `
      <form id="save-title" data-type="${esc(type)}" data-id="${esc(data.id || id)}" class="inline" style="margin-top:12px">
        <input type="text" name="title" value="${esc(title)}" aria-label="Title" required>
        <button class="quiet" type="submit">Rename</button>
      </form>
      <form id="save-body" data-type="${esc(type)}" data-id="${esc(data.id || id)}" style="margin-top:8px">
        <div class="section-title">Edit</div>
        <textarea name="body" aria-label="Note body">${esc(data.body || "")}</textarea>
        <div><button class="primary" type="submit">Save note</button></div>
      </form>` : "";
    const specEditor = type === "contribution" ? `
      <form id="save-spec" data-id="${esc(data.id || id)}" style="margin-top:16px">
        <div class="section-title">Public spec</div>
        <textarea name="body" aria-label="Public spec body">${esc(data.body || "")}</textarea>
        <div><button class="primary" type="submit">Save public spec</button></div>
      </form>` : "";
    const path = data.path ? `<div class="meta">${esc(data.path)}</div>` : "";
    panel.innerHTML = `
      <button type="button" class="quiet" id="close-reader">Close</button>
      ${path}
      <h3>${esc(title)}</h3>
      ${banner}
      <div class="reader-body">${renderMarkdown(body)}</div>
      ${editor}${specEditor}`;
  } catch (err) {
    panel.innerHTML = `<button type="button" class="quiet" id="close-reader">Close</button><p>${esc(err.message)}</p>`;
  }
}
function closeReader() {
  document.getElementById("reader").hidden = true;
}

document.body.addEventListener("click", async (event) => {
  const verdict = event.target.closest("[data-verdict]");
  if (verdict) {
    try {
      const note = verdict.parentElement && verdict.parentElement.querySelector("[data-run-note]");
      await api("/api/run/verdict", {method: "POST", body: JSON.stringify({
        id: Number(verdict.dataset.run), verdict: verdict.dataset.verdict, output: note ? note.value : "",
      })});
      toast(verdict.dataset.verdict === "approved" ? "Run approved" : "Run rejected");
      await load();
    } catch (err) {
      toast(err.message);
    }
    return;
  }
  const sync = event.target.closest("[data-sync]");
  if (sync) {
    try {
      sync.disabled = true;
      await api("/api/sync", {method: "POST", body: JSON.stringify({offline: sync.dataset.sync === "1"})});
      toast(sync.dataset.sync === "1" ? "Re-indexed local cache" : "GitHub cache refreshed");
      await load();
    } catch (err) {
      toast(err.message);
    }
    return;
  }
  const deploy = event.target.closest("[data-deploy]");
  if (deploy) {
    try {
      const result = await api("/api/settings", {method: "POST", body: JSON.stringify({deployment: deploy.dataset.deploy})});
      state.settingsToken = result.access_token || "";
      toast(result.deployment === "multi" ? "Shared server selected" : "This computer selected");
      await load();
    } catch (err) { toast(err.message); }
    return;
  }
  const rotate = event.target.closest("[data-rotate-token]");
  if (rotate) {
    try {
      const result = await api("/api/settings", {method: "POST", body: JSON.stringify({rotate: true})});
      state.settingsToken = result.access_token || "";
      toast("Token rotated");
      await load();
    } catch (err) { toast(err.message); }
    return;
  }
  const remove = event.target.closest("[data-delete-inbox]");
  if (remove) {
    if (!confirm("Delete this inbox note? This does not touch context/.")) return;
    try {
      await api("/api/inbox/delete", {method: "POST", body: JSON.stringify({name: remove.dataset.deleteInbox})});
      toast("Inbox note deleted");
      await load();
    } catch (err) {
      toast(err.message);
    }
    return;
  }
  const nav = event.target.closest("[data-nav]");
  if (nav) { state.view = nav.dataset.nav; state.settingsToken = ""; closeReader(); render(); return; }
  if (event.target.id === "welcome-continue") { await load(); return; }
  if (event.target.id === "close-reader") { closeReader(); return; }
  const open = event.target.closest("[data-open]");
  if (open && !event.target.closest("select")) openReader(open.dataset.type, open.dataset.id);
});
document.body.addEventListener("change", async (event) => {
  const status = event.target.closest("[data-set-status]");
  const contrib = event.target.closest("[data-set-contrib]");
  try {
    if (status) {
      await api("/api/task/status", {method: "POST", body: JSON.stringify({id: status.dataset.id, status: status.value})});
      toast("Status saved");
      await load();
    } else if (event.target.closest("[data-set-repo]")) {
      const repo = event.target.closest("[data-set-repo]");
      await api("/api/repo", {method: "POST", body: JSON.stringify({id: repo.dataset.id, [repo.dataset.field]: repo.value})});
      toast("Repo updated");
      await load();
    } else if (event.target.closest("[data-set-project]")) {
      const project = event.target.closest("[data-set-project]");
      await api("/api/project/status", {method: "POST", body: JSON.stringify({id: project.dataset.id, status: project.value})});
      toast("Project updated");
      await load();
    } else if (contrib) {
      await api("/api/contribution", {method: "POST", body: JSON.stringify({id: contrib.dataset.id, [contrib.dataset.field]: contrib.value})});
      toast("Contribution updated");
      await load();
    }
  } catch (err) {
    toast(err.message);
    await load();
  }
});
document.body.addEventListener("submit", async (event) => {
  const form = event.target;
  const handled = form.id === "add-task" || form.id === "capture" || form.id === "add-project"
    || form.id === "add-document" || form.id === "add-meeting" || form.id === "add-repo"
    || form.id === "save-body" || form.id === "save-title" || form.id === "save-spec"
    || form.id === "add-spec" || form.id === "onboard" || form.id === "welcome"
    || form.id === "add-actor" || form.id === "use-actor" || form.id === "add-account" || form.id === "set-model" || form.id === "set-factory"
    || form.dataset.factory || form.dataset.triage;
  if (!handled) return;
  event.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  if (event.submitter && event.submitter.name) data[event.submitter.name] = event.submitter.value;
  try {
    if (form.id === "add-task") {
      await api("/api/task", {method: "POST", body: JSON.stringify(data)});
      toast("Task added");
    } else if (form.id === "welcome") {
      const result = await api("/api/welcome", {method: "POST", body: JSON.stringify({
        title: data.title, url: data.url, deployment: data.deployment || "single",
      })});
      if (result.access_token) {
        document.getElementById("main").innerHTML = `<div class="welcome">
          <h2>Shared server</h2>
          <p>${esc(result.next || "")}</p>
          <p><strong>${esc(result.access_token)}</strong></p>
          <p class="meta">Copy it now. It will not be shown again. This window stays on this computer until you start Docker.</p>
          <button type="button" class="primary" id="welcome-continue">Continue on this computer</button>
        </div>`;
        return;
      }
      toast("Project created");
    } else if (form.id === "set-factory") {
      await api("/api/factory/defaults", {method: "POST", body: JSON.stringify({
        trigger: data.trigger, reach: data.reach,
      })});
      toast("Factory default saved");
    } else if (form.id === "set-model") {
      const body = {provider: data.provider, name: data.name, base_url: data.base_url || ""};
      if (data.api_key) body.api_key = data.api_key;
      await api("/api/model", {method: "POST", body: JSON.stringify(body)});
      toast("Model saved");
    } else if (form.id === "use-actor") {
      await api("/api/actor/use", {method: "POST", body: JSON.stringify({id: data.id})});
      toast("Writing as " + data.id);
    } else if (form.id === "add-account") {
      const result = await api("/api/account", {method: "POST", body: JSON.stringify({name: data.name, actor: data.actor})});
      state.accountPassword = result.password || "";
      state.accountName = result.name || data.name;
      toast("Sign-in added. Copy the password.");
      form.reset();
    } else if (form.id === "add-actor") {
      await api("/api/actor", {method: "POST", body: JSON.stringify(data)});
      toast("Actor added");
      form.reset();
    } else if (form.id === "onboard") {
      state.onboardResult = await api("/api/onboard", {method: "POST", body: JSON.stringify({
        title: data.title, kind: data.kind, url: data.url, path: data.path,
        method: data.method, integration: data.integration,
      })});
      toast("Onboarded " + state.onboardResult.project);
      form.reset();
    } else if (form.id === "add-project") {
      await api("/api/object", {method: "POST", body: JSON.stringify({type: "project", title: data.title, status: data.status})});
      toast("Project added");
      form.reset();
    } else if (form.id === "add-document" || form.id === "add-meeting") {
      await api("/api/object", {method: "POST", body: JSON.stringify({
        type: form.id === "add-document" ? "document" : "meeting",
        title: data.title, project: data.project, body: data.body,
      })});
      toast("Saved");
      form.reset();
    } else if (form.id === "add-repo") {
      await api("/api/object", {method: "POST", body: JSON.stringify({
        type: "repo", title: data.title, url: data.url, kind: data.kind, status: data.status,
      })});
      toast("Repo added");
      form.reset();
    } else if (form.id === "add-spec") {
      await api("/api/contribution/add", {method: "POST", body: JSON.stringify(data)});
      toast("Added to the local cache");
      form.reset();
    } else if (form.id === "save-title") {
      await api("/api/title", {method: "POST", body: JSON.stringify({
        type: form.dataset.type, id: form.dataset.id, title: data.title,
      })});
      toast("Renamed");
      await load();
      await openReader(form.dataset.type, form.dataset.id);
      return;
    } else if (form.id === "save-spec") {
      await api("/api/contribution/body", {method: "POST", body: JSON.stringify({
        id: form.dataset.id, body: data.body,
      })});
      toast("Public spec saved");
      await load();
      await openReader("contribution", form.dataset.id);
      return;
    } else if (form.id === "save-body") {
      await api("/api/object/body", {method: "POST", body: JSON.stringify({
        type: form.dataset.type, id: form.dataset.id, body: data.body,
      })});
      toast("Note saved");
      await load();
      await openReader(form.dataset.type, form.dataset.id);
      return;
    } else if (form.dataset.triage) {
      await api("/api/inbox/triage", {method: "POST", body: JSON.stringify({
        name: form.dataset.triage, type: data.type, project: data.project, title: data.title,
      })});
      toast("Filed into context");
    } else if (form.id === "capture") {
      await api("/api/capture", {method: "POST", body: JSON.stringify(data)});
      toast("Dropped in inbox");
      form.reset();
    } else {
      const payload = {factory: form.dataset.factory};
      if (form.dataset.needs === "project") payload.project = data.project;
      if (form.dataset.needs === "contribution") {
        payload.contribution = data.contribution;
        if (data.reach) payload.reach = data.reach;
      }
      if (data.generate === "1") payload.generate = true;
      const result = await api("/api/factory/run", {method: "POST", body: JSON.stringify(payload)});
      toast(result.generated ? "Draft " + result.output_path : "Shadow run " + result.run_id + " · " + result.run_dir);
    }
    await load();
  } catch (err) {
    toast(err.message);
  }
});
document.getElementById("q").addEventListener("input", (event) => {
  state.q = event.target.value.trim().toLowerCase();
  render();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeReader();
  if (event.key === "/" && document.activeElement.id !== "q" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
    event.preventDefault();
    document.getElementById("q").focus();
  }
});
load().catch(err => {
  document.getElementById("main").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
});
</script>
</body>
</html>
