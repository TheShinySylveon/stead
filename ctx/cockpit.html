<main>
  <div class="top">
    <div>
      <h2 id="title">Home</h2>
      <p id="subtitle"></p>
    </div>
    <input id="q" type="search" placeholder="Filter this view" aria-label="Filter this view">

<aside id="reader" hidden></aside>
<div id="toast" hidden role="status"></div>
<script>
const TOKEN = document.querySelector('meta[name="ctx-token"]').content;
const VIEWS = [
  ["home", "Home"],
  ["tasks", "Tasks"],
  ["projects", "Projects"],
  ["library", "Library"],
  ["repos", "Repos"],
  ["wiki", "Wiki"],
  ["inbox", "Inbox"],
  ["factories", "Factories"],
  ["settings", "Settings"],
];
const TITLES = {
  home: ["Home", "What needs you, across projects and contributions."],
  tasks: ["Tasks", "Move work by status. The file and the index update together."],
  projects: ["Projects", "Onboard a project with its repo and constitution, or add a project on its own."],
  library: ["Library", "Private notes and meetings. Read them, or edit the note and save."],
  repos: ["Repos", "Own projects and OSS. Sync is read-only. Contribution files stay public."],
  wiki: ["Wiki", "The readable record for one repo: start with the essentials, then drill in."],
  inbox: ["Inbox", "Unsorted capture. File it into a document, meeting, or task, or delete it."],
  factories: ["Factories", "Assemble a shadow bundle. A person or an agent still has to write the output."],
  settings: ["Settings", "This computer, a shared server, the model, and how far the software factory may go."],
};
const state = { snap: null, view: "home", q: "", onboardResult: null,
  scheduleText: "", scheduleProject: "", hookToken: "",
  showAllRuns: false, evals: {}, opener: null, dirty: false,
  wikiRepo: "", wiki: null, wikiPath: "", wikiPageData: null,
  wikiArrange: false, wikiRequestForm: false };

function when(value) {
  if (!value) return "";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function chip(text, tone) {
  return `<span class="chip ${esc(tone || "")}">${esc(text)}</span>`;
}
function match(item) {
  if (!state.q) return true;
  const hay = [item.title, item.id, item.name, item.status, item.state, item.kind]
    .filter(Boolean).join(" ").toLowerCase();
  return hay.includes(state.q);
}
function options(values, selected) {
  return values.map(v => `<option${v === selected ? " selected" : ""}>${esc(v)}</option>`).join("");
}
function toast(message, ms) {
  const el = document.getElementById("toast");
  el.hidden = false;
  el.textContent = message;
  clearTimeout(toast._t);
  const wait = ms || (/fail|error|refus|missing|wrong|cannot|too |invalid|not found/i.test(String(message)) ? 6000 : 2600);
  toast._t = setTimeout(() => { el.hidden = true; }, wait);
}
async function api(path, opts) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "X-Ctx-Token": TOKEN,
      ...(opts && opts.headers),
    },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
async function awaitTask(path, payload, verb) {
  const started = await api(path, {method: "POST", body: JSON.stringify(payload)});
  const taskId = started.task;
  if (!taskId) throw new Error(verb + " did not start");
  toast(verb + " started…");
  let last = "";
  for (let i = 0; i < 2400; i++) {
    await new Promise(r => setTimeout(r, 1500));
    const snap = await api("/api/task?id=" + encodeURIComponent(taskId));
    if (snap.status === "done") return snap.result;
    if (snap.status === "failed") throw new Error(snap.error || (verb + " failed"));
    const line = snap.progress[snap.progress.length - 1];
    if (line && line !== last) { last = line; toast(line); }
  }
  throw new Error(verb + " is taking too long; watch it in the terminal");
}

function wikiTree(nodes, current, depth, pinned, arrange) {
  return (nodes || []).map(node => {
    const active = current === node.slug;
    const open = active || (current && current.startsWith(node.slug + "/"));
    const kids = (open && node.children && node.children.length)
      ? `<div class="wiki-children">${wikiTree(node.children, current, depth + 1, pinned, arrange)}</div>` : "";
    const isPinned = (pinned || []).includes(node.slug);
    const controls = arrange
      ? `<span class="wiki-ctl"><button type="button" class="wiki-mini" data-wiki-move="${esc(node.slug)}" data-dir="up" aria-label="Move up">↑</button><button type="button" class="wiki-mini" data-wiki-move="${esc(node.slug)}" data-dir="down" aria-label="Move down">↓</button><button type="button" class="wiki-mini" data-wiki-pin="${esc(node.slug)}" data-pinned="${isPinned ? "1" : "0"}" aria-label="Pin">${isPinned ? "★" : "☆"}</button></span>`
      : "";
    return `<div class="wiki-node"><div class="wiki-node-row"><button type="button" data-wiki-page="${esc(node.slug)}" ${active ? 'aria-current="page"' : ""} style="padding-left:${8 + depth * 14}px">${esc(node.title)}</button>${controls}</div>${kids}</div>`;
  }).join("");
}

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function headingId(text) {
  return "h-" + String(text).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}
function renderMarkdown(src) {
  const fences = [];
  const text = String(src || "").replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => {
    fences.push("<pre><code>" + esc(code.replace(/^\n|\n$/g, "")) + "</code></pre>");
    return "\u0000" + (fences.length - 1) + "\u0000";
  });
  let html = "";
  for (const block of text.split(/\n{2,}/)) {
    const lines = block.split("\n").filter(line => line.trim());
    if (!lines.length) continue;
    const fence = lines[0].match(/^\u0000(\d+)\u0000$/);
    if (fence && lines.length === 1) { html += fences[+fence[1]]; continue; }
    const heading = lines[0].match(/^(#{1,3}) (.+)$/);
    if (heading && lines.length === 1) {
      const n = heading[1].length;
      html += `<h${n} id="${headingId(heading[2])}">${inline(heading[2])}</h${n}>`;
      continue;
    }
    const items = lines.map(line => line.match(/^\s*[-*] \[[ xX]\] (.+)$/) || line.match(/^\s*[-*] (.+)$/));
    if (items.every(Boolean)) {
      html += "<ul>" + items.map(item => "<li>" + inline(item[1]) + "</li>").join("") + "</ul>";
      continue;
    }
    html += "<p>" + inline(lines.join(" ")) + "</p>";
  }
  return html;
}
async function openWiki(repo) {

    state.wiki = await api("/api/wiki?repo=" + encodeURIComponent(repo));
    if (state.wikiPath) {

        "&page=" + encodeURIComponent(state.wikiPath));

}

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") { closeReader(); return; }
  if (event.key !== "Tab") return;
  const panel = document.getElementById("reader");
  if (panel.hidden) return;
  const nodes = Array.from(panel.querySelectorAll(
    'button, [href], input, textarea, select, [tabindex]:not([tabindex="-1"])'
  )).filter(node => !node.disabled && node.offsetParent !== null);
  if (!nodes.length) return;
  const first = nodes[0];
  const last = nodes[nodes.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

        <span><strong>${esc(rec.title)}</strong><br><small>${esc(rec.created)} · ${esc(rec.outcome)} · ${esc(rec.repo)}</small></span>
        <span class="chips">${chip(rec.correct || "unverified", rec.correct === "true" ? "done" : rec.correct === "false" ? "fail" : "doing")}
        <button type="button" class="quiet" data-mark="${esc(rec.id)}" data-correct="true">Correct</button>
        <button type="button" class="quiet" data-mark="${esc(rec.id)}" data-correct="false">Incorrect</button></span>
      </div>`).join("");
      out.innerHTML = `<p class="meta">${r.builds} builds · ${r.outcomes.merged} merged · ${r.correct} correct · ${r.incorrect} incorrect · failure rate ${Math.round((r.failure_rate || 0) * 100)}%</p>
        <div class="list">${rows || '<div class="empty">No build records.</div>'}</div>`;
    } catch (err) { toast(err.message); }
    return;
  }
  const mark = event.target.closest("[data-mark]");
  if (mark) {
    try {
      await api("/api/metrics/mark", {method: "POST", body: JSON.stringify({
        record: mark.dataset.mark, correct: mark.dataset.correct === "true",
      })});
      toast("Verdict recorded");
    } catch (err) { toast(err.message); }
    return;
  }
  const monitor = event.target.closest("[data-monitor]");
  if (monitor) {
    const interval = (document.getElementById("schedule-interval") || {}).value || "";
    if (!interval) { toast("Pick an interval first"); return; }
    const install = monitor.dataset.monitor === "install";
    if (install && !confirm("Install the " + interval + " monitor task? It syncs and builds + publishes watched specs on a schedule.")) return;
    try {
      const result = await api("/api/schedule", {method: "POST", body: JSON.stringify({
        interval, watch: true, install,
      })});
      if (install) { toast("Monitor task installed"); }
      else { state.scheduleText = result.text; render(); }
    } catch (err) { toast(err.message); }
    return;
  }
  if (event.target.closest("[data-hook]")) {
    try {
      const result = await api("/api/hook", {method: "POST", body: JSON.stringify({create: true})});
      state.hookToken = result.token;
      toast("Copy the webhook token now");
      await load();
    } catch (err) { toast(err.message); }
    return;
  }
  const sched = event.target.closest("[data-schedule]");
  if (sched) {
    const picker = document.getElementById("schedule-project");
    const project = picker ? picker.value : "";
    try {
      if (sched.dataset.schedule === "install") {
        await api("/api/schedule", {method: "POST", body: JSON.stringify({install: true, project})});
        toast("Weekly task installed");
      } else {
        const result = await api("/api/schedule", {method: "POST", body: JSON.stringify({project})});
        state.scheduleText = result.text;
        state.scheduleProject = project;
        render();
      }
    } catch (err) { toast(err.message); }
    return;
  }
  const reset = event.target.closest("[data-account-reset]");
  if (reset) {
    try {
      const result = await api("/api/account/reset", {method: "POST", body: JSON.stringify({name: reset.dataset.accountReset})});
      state.accountPassword = result.password;
      state.accountName = result.name;
      toast("Password reset. Copy it now.");
      await load();
    } catch (err) { toast(err.message); }
    return;
  }
  const nav = event.target.closest("[data-nav]");
  if (nav) {
    state.view = nav.dataset.nav;
    state.settingsToken = "";
    closeReader();
    if (state.view === "wiki" && state.wikiRepo) {
      await openWiki(state.wikiRepo);
    } else {
      render();
    }
    return;
  }
  const wikiOpen = event.target.closest("[data-wiki-open]");
  if (wikiOpen) { await openWiki(wikiOpen.dataset.wikiOpen); return; }
  if (event.target.closest("[data-wiki-picker]")) {
    state.wikiRepo = "";
    state.wiki = null;
    state.wikiPath = "";
    state.wikiPageData = null;
    render();
    return;
  }
  const wikiPageBtn = event.target.closest("[data-wiki-page]");
  if (wikiPageBtn) { await openWikiPage(wikiPageBtn.dataset.wikiPage); return; }
  if (event.target.closest("[data-wiki-home]")) {
    state.wikiPath = "";
    state.wikiPageData = null;
    render();
    return;
  }
  if (event.target.closest("[data-wiki-arrange]")) {
    state.wikiArrange = !state.wikiArrange;
    render();
    return;
  }
  if (event.target.closest("[data-wiki-request-open]")) {
    state.wikiRequestForm = true;
    render();
    return;
  }
  if (event.target.closest("[data-wiki-request-cancel]")) {
    state.wikiRequestForm = false;
    render();
    return;
  }
  const wikiMove = event.target.closest("[data-wiki-move]");
  if (wikiMove) {
    try {
      await api("/api/wiki/action", {method: "POST", body: JSON.stringify({
        action: "move", repo: state.wikiRepo, path: wikiMove.dataset.wikiMove,
        direction: wikiMove.dataset.dir,
      })});
      await openWiki(state.wikiRepo);
    } catch (err) { toast(err.message); }
    return;
  }
  const wikiPin = event.target.closest("[data-wiki-pin]");
  if (wikiPin) {
    try {
      await api("/api/wiki/action", {method: "POST", body: JSON.stringify({
        action: "pin", repo: state.wikiRepo, path: wikiPin.dataset.wikiPin,
        pinned: wikiPin.dataset.pinned !== "1",
      })});
      await openWiki(state.wikiRepo);
    } catch (err) { toast(err.message); }
    return;
  }
  const wikiClose = event.target.closest("[data-wiki-close-request]");
  if (wikiClose) {
    if (!confirm("Mark this request done?")) return;
    try {
      await api("/api/wiki/action", {method: "POST", body: JSON.stringify({
        action: "close_request", id: wikiClose.dataset.wikiCloseRequest,
      })});
      toast("Request closed");
      await openWikiPage(state.wikiPath);
    } catch (err) { toast(err.message); }
    return;
  }
  if (event.target.id === "welcome-continue") { await load(); return; }
  if (event.target.id === "close-reader") { closeReader(); return; }
  const open = event.target.closest("[data-open]");
  if (open && !event.target.closest("select")) openReader(open.dataset.type, open.dataset.id);
});
document.body.addEventListener("change", async (event) => {
  const promoteSelect = event.target.closest("[data-promote] select");
  if (promoteSelect) {
    const form = promoteSelect.closest("[data-promote]");
    const factory = state.snap.factories.find(f => f.name === form.dataset.promote);
    const prod = factory && (factory.prompts || []).find(p => p.status === "production");
    const button = form.querySelector("[data-promote-button]");
    if (button) button.disabled = !prod || promoteSelect.value === prod.version;
    return;
  }
  const status = event.target.closest("[data-set-status]");
  const contrib = event.target.closest("[data-set-contrib]");
  try {
    if (status) {
      await api("/api/task/status", {method: "POST", body: JSON.stringify({id: status.dataset.id, status: status.value})});
      toast("Status saved");
      await load();
    } else if (event.target.closest("[data-set-repo]")) {
      const repo = event.target.closest("[data-set-repo]");
      await api("/api/repo", {method: "POST", body: JSON.stringify({id: repo.dataset.id, [repo.dataset.field]: repo.value})});
      toast("Repo updated");
      await load();
    } else if (event.target.closest("[data-set-repo-text]")) {
      const repo = event.target.closest("[data-set-repo-text]");
      await api("/api/repo", {method: "POST", body: JSON.stringify({id: repo.dataset.id, [repo.dataset.field]: repo.value})});
      toast(repo.dataset.field === "code_path" ? "Code path saved" : "Default branch saved");
      await load();
    } else if (event.target.closest("[data-set-project]")) {
      const project = event.target.closest("[data-set-project]");
      await api("/api/project/status", {method: "POST", body: JSON.stringify({id: project.dataset.id, status: project.value})});
      toast("Project updated");
      await load();
    } else if (contrib) {
      await api("/api/contribution", {method: "POST", body: JSON.stringify({id: contrib.dataset.id, [contrib.dataset.field]: contrib.value})});
      toast("Contribution updated");
      await load();
    }
  } catch (err) {
    toast(err.message);
    await load();
  }
});
document.body.addEventListener("submit", async (event) => {
  const form = event.target;
  const handled = form.id === "add-task" || form.id === "capture" || form.id === "add-project"
    || form.id === "add-document" || form.id === "add-meeting" || form.id === "add-repo"
    || form.id === "save-body" || form.id === "save-title" || form.id === "save-spec"
    || form.id === "add-spec" || form.id === "onboard" || form.id === "welcome"
    || form.id === "add-actor" || form.id === "use-actor" || form.id === "add-account" || form.id === "set-model" || form.id === "set-factory"
    || form.id === "new-factory" || form.id === "import-inbox" || form.dataset.promote
    || form.id === "wiki-request"
    || form.dataset.factory || form.dataset.triage;
  if (!handled) return;
  event.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  if (event.submitter && event.submitter.name) data[event.submitter.name] = event.submitter.value;
  const submitter = event.submitter;
  if (submitter) submitter.disabled = true;
  try {
    if (form.id === "add-task") {
      await api("/api/task", {method: "POST", body: JSON.stringify(data)});
      toast("Task added");
    } else if (form.id === "welcome") {
      const result = await api("/api/welcome", {method: "POST", body: JSON.stringify({
        title: data.title, url: data.url, deployment: data.deployment || "single",
      })});
      if (result.access_token) {
        document.getElementById("main").innerHTML = `<div class="welcome">
          <h2>Shared server</h2>
          <p>${esc(result.next || "")}</p>
          <p><strong>${esc(result.access_token)}</strong></p>
          <p class="meta">Copy it now. It will not be shown again. This window stays on this computer until you start Docker.</p>
          <button type="button" class="primary" id="welcome-continue">Continue on this computer</button>
        </div>`;
        return;
      }
      toast("Project created");
    } else if (form.id === "set-factory") {
      const body = {trigger: data.trigger, reach: data.reach};
      if (data.build_minutes) body.build_minutes = Number(data.build_minutes);
      await api("/api/factory/defaults", {method: "POST", body: JSON.stringify(body)});
      toast("Factory default saved");
    } else if (form.id === "set-model") {
      const body = {provider: data.provider, name: data.name, base_url: data.base_url || ""};
      if (data.api_key) body.api_key = data.api_key;
      if (data.call_timeout) body.call_timeout = Number(data.call_timeout);
      await api("/api/model", {method: "POST", body: JSON.stringify(body)});
      toast("Model saved");
    } else if (form.id === "use-actor") {
      await api("/api/actor/use", {method: "POST", body: JSON.stringify({id: data.id})});
      toast("Writing as " + data.id);
    } else if (form.id === "add-account") {
      const result = await api("/api/account", {method: "POST", body: JSON.stringify({name: data.name, actor: data.actor})});
      state.accountPassword = result.password || "";
      state.accountName = result.name || data.name;
      toast("Sign-in added. Copy the password.");
      form.reset();
    } else if (form.id === "add-actor") {
      await api("/api/actor", {method: "POST", body: JSON.stringify(data)});
      toast("Actor added");
      form.reset();
    } else if (form.id === "new-factory") {
      const result = await api("/api/factory/new", {method: "POST", body: JSON.stringify({name: data.name, title: data.title})});
      toast("Created " + result.name + ". Check evals before promoting.");
      form.reset();
      await load();
    } else if (form.id === "import-inbox") {
      const file = form.querySelector('input[type="file"]');
      if (!file || !file.files.length) { toast("Choose a file first"); return; }
      const body = new FormData();
      body.append("file", file.files[0]);
      const res = await fetch("/api/inbox/import", {
        method: "POST", headers: {"X-Ctx-Token": TOKEN}, body,
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(result.error || res.statusText);
      toast("Imported " + result.imported.length + " note(s)");
      form.reset();
      await load();
    } else if (form.dataset.promote) {
      const result = await api("/api/prompt/promote", {method: "POST", body: JSON.stringify({
        factory: form.dataset.promote, version: data.version,
      })});
      toast(result.version + " is production");
      await load();
    } else if (form.id === "wiki-request") {
      const result = await api("/api/wiki/action", {method: "POST", body: JSON.stringify({
        action: "request", repo: form.dataset.repo, page: form.dataset.page,
        title: data.title, text: data.text,
      })});
      state.wikiRequestForm = false;
      toast("Request filed: " + result.title);
      state.wikiPageData = await api("/api/wiki?repo=" + encodeURIComponent(state.wikiRepo) +
        (state.wikiPath ? "&page=" + encodeURIComponent(state.wikiPath) : ""));
      state.wiki = await api("/api/wiki?repo=" + encodeURIComponent(state.wikiRepo));
    } else if (form.id === "onboard") {
      state.onboardResult = await api("/api/onboard", {method: "POST", body: JSON.stringify({
        title: data.title, kind: data.kind, url: data.url, path: data.path,
        method: data.method, integration: data.integration,
      })});
      toast("Onboarded " + state.onboardResult.project);
      form.reset();
    } else if (form.id === "add-project") {
      await api("/api/object", {method: "POST", body: JSON.stringify({type: "project", title: data.title, status: data.status})});
      toast("Project added");
      form.reset();
    } else if (form.id === "add-document" || form.id === "add-meeting") {
      await api("/api/object", {method: "POST", body: JSON.stringify({
        type: form.id === "add-document" ? "document" : "meeting",
        title: data.title, project: data.project, body: data.body,
      })});
      toast("Saved");
      form.reset();
    } else if (form.id === "add-repo") {
      await api("/api/object", {method: "POST", body: JSON.stringify({
        type: "repo", title: data.title, url: data.url, kind: data.kind, status: data.status,
      })});
      toast("Repo added");
      form.reset();
    } else if (form.id === "add-spec") {
      await api("/api/contribution/add", {method: "POST", body: JSON.stringify(data)});
      toast("Added to the local cache");
      form.reset();
    } else if (form.id === "save-title") {
      await api("/api/title", {method: "POST", body: JSON.stringify({
        type: form.dataset.type, id: form.dataset.id, title: data.title,
      })});
      toast("Renamed");
      await load();
      await openReader(form.dataset.type, form.dataset.id);
      return;
    } else if (form.id === "save-spec") {
      await api("/api/contribution/body", {method: "POST", body: JSON.stringify({
        id: form.dataset.id, body: data.body,
      })});
      toast("Public spec saved");
      await load();
      await openReader("contribution", form.dataset.id);
      return;
    } else if (form.id === "save-body") {
      await api("/api/object/body", {method: "POST", body: JSON.stringify({
        type: form.dataset.type, id: form.dataset.id, body: data.body,
      })});
      toast("Note saved");
      await load();
      await openReader(form.dataset.type, form.dataset.id);
      return;
    } else if (form.dataset.triage) {
      await api("/api/inbox/triage", {method: "POST", body: JSON.stringify({
        name: form.dataset.triage, type: data.type, project: data.project, title: data.title,
      })});
      toast("Filed into context");
    } else if (form.id === "capture") {
      await api("/api/capture", {method: "POST", body: JSON.stringify(data)});
      toast("Dropped in inbox");
      form.reset();
    } else {
      const payload = {factory: form.dataset.factory};
      if (form.dataset.needs === "project") payload.project = data.project;
      if (form.dataset.needs === "contribution") {
        payload.contribution = data.contribution;
        if (data.reach) payload.reach = data.reach;
      }
      if (data.generate === "1") payload.generate = true;
      const result = await api("/api/factory/run", {method: "POST", body: JSON.stringify(payload)});
      toast(result.generated ? "Draft " + result.output_path : "Shadow run " + result.run_id + " · " + result.run_dir);
    }
    await load();
  } catch (err) {
    toast(err.message);
  } finally {
    if (submitter) submitter.disabled = false;
  }
});
document.getElementById("q").addEventListener("input", (event) => {
  state.q = event.target.value.trim().toLowerCase();
  render();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeReader();
  if (event.key === "/" && document.activeElement.id !== "q" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
    event.preventDefault();
    document.getElementById("q").focus();
  }
});
load().catch(err => {
  document.getElementById("main").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
});
</script>
</body>
</html>
