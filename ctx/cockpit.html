const VALID_VIEWS = new Set(VIEWS.map(([id]) => id));

function when(value) {
  if (!value) return "";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString();
}
function ago(value) {
  if (!value) return "";
  const d = new Date(String(value).slice(0, 10) + "T00:00:00");
  if (Number.isNaN(d.getTime())) return String(value);
  const days = Math.round((Date.now() - d.getTime()) / 86400000);
  if (days < 0) return "just now";
  if (days === 0) return "today";
  if (days < 7) return days + "d ago";
  if (days < 30) return Math.floor(days / 7) + "w ago";
  if (days < 365) return Math.floor(days / 30) + "mo ago";
  return Math.floor(days / 365) + "y ago";
}

function esc(s) {

async function api(path, opts) {

}

}
function liveLog(id) {

async function awaitTask(path, payload, verb, logEl) {
  const contribution = payload.contribution || "";
  if (contribution) { state.logs[contribution] = []; delete state.results[contribution]; }
  const started = await api(path, {method: "POST", body: JSON.stringify(payload)});
  const taskId = started.task;
  if (!taskId) throw new Error(verb + " did not start");
  const write = (text) => {
    if (contribution) state.logs[contribution].push(text);
    // The log the task started from (the reader or the card) while it is on screen,
    // plus the card's current log: a redraw may have replaced the card's.
    const targets = new Set();
    if (logEl && logEl.isConnected) targets.add(logEl);
    const card = contribution && liveLog(contribution);
    if (card) targets.add(card);
    for (const live of targets) { live.hidden = false; live.textContent += text + "\n"; live.scrollTop = live.scrollHeight; }
    if (contribution) {
      state.activity = { contribution, verb, line: text };
      const lineEl = Array.from(document.querySelectorAll("[data-activity]"))
        .find(el => el.dataset.activity === contribution);
      if (lineEl) lineEl.textContent = text;
    }
  };
  write(verb + " started…");
  let seen = 0;
  try {
    while (true) {
      await new Promise(r => setTimeout(r, 1200));
      const snap = await api("/api/task?id=" + encodeURIComponent(taskId));
      if (snap.status === "done") { write("✓ " + verb + " finished."); return snap.result; }
      if (snap.status === "failed") { write("✗ " + (snap.error || (verb + " failed"))); throw new Error(snap.error || (verb + " failed")); }
      const lines = snap.progress || [];
      const total = snap.progress_total;
      if (total != null) {
        const fresh = total - seen;
        if (fresh > 0) {
          const start = Math.max(0, lines.length - fresh);
          for (let j = start; j < lines.length; j++) write(lines[j]);
          seen = total;
        }
      } else {
        for (let j = seen; j < lines.length; j++) write(lines[j]);
        seen = lines.length;
      }
    }

    if (contribution && state.activity && state.activity.contribution === contribution) {
      state.activity = null;
      const lineEl = Array.from(document.querySelectorAll("[data-activity]"))
        .find(el => el.dataset.activity === contribution);
      if (lineEl) lineEl.textContent = "";

  }
}

function wikiTree(nodes, current, depth, pinned, arrange) {
  return (nodes || []).map(node => {
    const active = current === node.slug;
    const open = active || (current && current.startsWith(node.slug + "/"));
    const kids = (open && node.children && node.children.length)
      ? `<div class="wiki-children">${wikiTree(node.children, current, depth + 1, pinned, arrange)}</div>` : "";
    const isPinned = (pinned || []).includes(node.slug);
    const controls = arrange
      ? `<span class="wiki-ctl"><button type="button" class="wiki-mini" data-wiki-move="${esc(node.slug)}" data-dir="up" aria-label="Move up">↑</button><button type="button" class="wiki-mini" data-wiki-move="${esc(node.slug)}" data-dir="down" aria-label="Move down">↓</button><button type="button" class="wiki-mini" data-wiki-pin="${esc(node.slug)}" data-pinned="${isPinned ? "1" : "0"}" aria-label="Pin">${isPinned ? "★" : "☆"}</button></span>`
      : "";
    return `<div class="wiki-node"><div class="wiki-node-row"><button type="button" data-wiki-page="${esc(node.slug)}" ${active ? 'aria-current="page"' : ""} style="padding-left:${8 + depth * 14}px">${esc(node.title)}</button>${controls}</div>${kids}</div>`;
  }).join("");
}
function wikiToc(markdown) {
  const rows = [];
  String(markdown || "").split("\n").forEach(line => {
    const match = line.match(/^(#{2,3}) (.+)$/);
    if (match) rows.push({ level: match[1].length, text: match[2] });
  });
  if (rows.length < 2) return "";
  return `<div class="wiki-toc"><div class="section-title">On this page</div>${rows.map(row =>
    `<a href="#${headingId(row.text)}" class="meta" style="display:block;padding-left:${(row.level - 2) * 12}px">${esc(row.text)}</a>`).join("")}</div>`;
}

function inline(s) {
  // Code spans and link tags are set aside first so emphasis cannot touch them.
  const kept = [];
  const hold = (html) => "\u0001" + (kept.push(html) - 1) + "\u0001";
  return esc(s)
    .replace(/`([^`]+)`/g, (_, code) => hold("<code>" + code + "</code>"))
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, text, url) => hold('<a href="' + url + '" target="_blank" rel="noopener">') + text + hold("</a>"))
    .replace(/\[([^\]]+)\]\(((?:specs|decisions|glossary|tasks|history|requests)\/[A-Za-z0-9._-]+)\)/g, (_, text, slug) => hold('<button type="button" class="linkish" data-wiki-page="' + slug + '">') + text + hold("</button>"))
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^\w*])\*([^*\s][^*]*?)\*(?![\w*])/g, "$1<em>$2</em>")
    .replace(/(^|[^\w])_([^_\s][^_]*?)_(?!\w)/g, "$1<em>$2</em>")
    .replace(/\u0001(\d+)\u0001/g, (_, i) => kept[+i]);
}
function headingId(text) {
  return "h-" + String(text).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}
function renderMarkdown(src) {
  const fences = [];
  const text = String(src || "").replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => {
    fences.push("<pre><code>" + esc(code.replace(/^\n|\n$/g, "")) + "</code></pre>");
    return "\u0000" + (fences.length - 1) + "\u0000";
  });
  let html = "";
  for (const block of text.split(/\n{2,}/)) {
    const lines = block.split("\n").filter(line => line.trim());
    if (!lines.length) continue;
    const fence = lines[0].match(/^\u0000(\d+)\u0000$/);
    if (fence && lines.length === 1) { html += fences[+fence[1]]; continue; }
    const heading = lines[0].match(/^(#{1,3}) (.+)$/);
    if (heading && lines.length === 1) {
      const n = heading[1].length;
      html += `<h${n} id="${headingId(heading[2])}">${inline(heading[2])}</h${n}>`;
      continue;
    }
    const items = lines.map(line => line.match(/^\s*[-*] \[[ xX]\] (.+)$/) || line.match(/^\s*[-*] (.+)$/));
    if (items.every(Boolean)) {
      html += "<ul>" + items.map(item => "<li>" + inline(item[1]) + "</li>").join("") + "</ul>";
      continue;
    }
    html += "<p>" + inline(lines.join(" ")) + "</p>";
  }
  return html;
}

function hydrateBuildLock(rootEl) {
  const lockCtl = rootEl && rootEl.querySelector("[data-build-lock]");
  if (!lockCtl) return;
  const cid = lockCtl.dataset.buildLock;
  api("/api/build/lock?contribution=" + encodeURIComponent(cid))
    .then(info => renderBuildLock(lockCtl, cid, info))
    .catch(() => {});
}
function renderBuildLock(el, cid, info) {
  if (!info || !info.exists) {
    el.innerHTML = `<span class="meta">Build lock: none</span>`;
    return;
  }
  const live = info.reclaimable === false;
  const parts = [];
  if (info.pid != null) parts.push("pid " + info.pid);
  if (info.host) parts.push(info.host);
  if (info.age_seconds != null) parts.push(Math.round(info.age_seconds) + "s old");
  const who = parts.length ? ": " + parts.join(" · ") : "";
  el.innerHTML = `
    <span class="meta" style="color:var(--color-bad)">Build lock held${esc(who)} — ${live ? "a build may be running" : "looks stale"}.</span>
    <button type="button" class="quiet" data-lock-remove="${esc(cid)}" data-live="${live ? "1" : "0"}">Remove lock</button>`;
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") { closeReader(); return; }
  if (event.key !== "Tab") return;
  const panel = document.getElementById("reader");
  if (panel.hidden) return;
  const nodes = Array.from(panel.querySelectorAll(
    'button, [href], input, textarea, select, [tabindex]:not([tabindex="-1"])'
  )).filter(node => !node.disabled && node.offsetParent !== null);
  if (!nodes.length) return;
  const first = nodes[0];
  const last = nodes[nodes.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

      await api("/api/model/add", {method: "POST", body: JSON.stringify(body)});
      toast("Profile saved");
    } else if (form.id === "use-actor") {
      await api("/api/actor/use", {method: "POST", body: JSON.stringify({id: data.id})});
      toast("Writing as " + data.id);
    } else if (form.id === "add-account") {
      const result = await api("/api/account", {method: "POST", body: JSON.stringify({name: data.name, actor: data.actor})});
      state.accountPassword = result.password || "";
      state.accountName = result.name || data.name;
      toast("Sign-in added. Copy the password.");
      form.reset();
    } else if (form.id === "add-actor") {
      await api("/api/actor", {method: "POST", body: JSON.stringify(data)});
      toast("Actor added");
      form.reset();
    } else if (form.id === "new-factory") {
      const result = await api("/api/factory/new", {method: "POST", body: JSON.stringify({name: data.name, title: data.title})});
      toast("Created " + result.name + ". Next: Check evals, then Assemble shadow.");
      form.reset();
      await load();
    } else if (form.id === "import-inbox") {
      const file = form.querySelector('input[type="file"]');
      if (!file || !file.files.length) { toast("Choose a file first"); return; }
      const body = new FormData();
      body.append("file", file.files[0]);
      const res = await fetch("/api/inbox/import", {
        method: "POST", headers: {"X-Ctx-Token": TOKEN}, body,
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(result.error || res.statusText);
      toast("Imported " + result.imported.length + " note(s)");
      form.reset();
      await load();
    } else if (form.dataset.promote) {
      const result = await api("/api/prompt/promote", {method: "POST", body: JSON.stringify({
        factory: form.dataset.promote, version: data.version,
      })});
      toast(result.version + " is production");
      await load();
    } else if (form.id === "wiki-request") {
      const result = await api("/api/wiki/action", {method: "POST", body: JSON.stringify({
        action: "request", repo: form.dataset.repo, page: form.dataset.page,
        title: data.title, text: data.text,
      })});
      state.wikiRequestForm = false;
      toast("Request filed: " + result.title);
      state.wikiPageData = await api("/api/wiki?repo=" + encodeURIComponent(state.wikiRepo) +
        (state.wikiPath ? "&page=" + encodeURIComponent(state.wikiPath) : ""));
      state.wiki = await api("/api/wiki?repo=" + encodeURIComponent(state.wikiRepo));
    } else if (form.id === "onboard") {
      state.onboardResult = await api("/api/onboard", {method: "POST", body: JSON.stringify({
        title: data.title, kind: data.kind, url: data.url, path: data.path,
        method: data.method, integration: data.integration,
      })});
      toast("Onboarded " + state.onboardResult.project);
      form.reset();
    } else if (form.id === "add-project") {
      await api("/api/object", {method: "POST", body: JSON.stringify({type: "project", title: data.title, status: data.status})});
      toast("Project added");
      form.reset();
    } else if (form.id === "add-document" || form.id === "add-meeting") {
      await api("/api/object", {method: "POST", body: JSON.stringify({
        type: form.id === "add-document" ? "document" : "meeting",
        title: data.title, project: data.project, body: data.body,
      })});
      toast("Saved");
      form.reset();
    } else if (form.id === "add-repo") {
      await api("/api/object", {method: "POST", body: JSON.stringify({
        type: "repo", title: data.title, url: data.url, kind: data.kind, status: data.status,
      })});
      toast("Repo added");
      form.reset();
    } else if (form.id === "add-spec") {
      await api("/api/contribution/add", {method: "POST", body: JSON.stringify(data)});
      toast("Added to the local cache");
      form.reset();
    } else if (form.id === "save-title") {
      await api("/api/title", {method: "POST", body: JSON.stringify({
        type: form.dataset.type, id: form.dataset.id, title: data.title,
      })});
      toast("Renamed");
      await load();
      await openReader(form.dataset.type, form.dataset.id);
      return;
    } else if (form.id === "save-spec") {
      await api("/api/contribution/body", {method: "POST", body: JSON.stringify({
        id: form.dataset.id, body: data.body,
      })});
      toast("Public spec saved");
      await load();
      await openReader("contribution", form.dataset.id);
      return;
    } else if (form.id === "save-body") {
      await api("/api/object/body", {method: "POST", body: JSON.stringify({
        type: form.dataset.type, id: form.dataset.id, body: data.body,
      })});
      toast("Note saved");
      await load();
      await openReader(form.dataset.type, form.dataset.id);
      return;
    } else if (form.dataset.triage) {
      await api("/api/inbox/triage", {method: "POST", body: JSON.stringify({
        name: form.dataset.triage, type: data.type, project: data.project, title: data.title,
      })});
      toast("Filed into context");
    } else if (form.id === "capture") {
      await api("/api/capture", {method: "POST", body: JSON.stringify(data)});
      toast("Dropped in inbox");
      form.reset();
    } else {
      const payload = {factory: form.dataset.factory};
      if (form.dataset.needs === "project") payload.project = data.project;
      if (form.dataset.needs === "contribution") {
        payload.contribution = data.contribution;
        if (data.reach) payload.reach = data.reach;
      }
      if (data.generate === "1") payload.generate = true;
      const result = await api("/api/factory/run", {method: "POST", body: JSON.stringify(payload)});
      toast(result.generated ? "Draft " + result.output_path : "Shadow run " + result.run_id + " · " + result.run_dir);
    }
    await load();
  } catch (err) {
    toast(err.message);
  } finally {
    if (submitter) submitter.disabled = false;
  }
});
document.getElementById("q").addEventListener("keydown", (event) => {
  if (event.key === "Enter") { event.preventDefault(); runSearch(event.target.value.trim()); }
  if (event.key === "Escape" && event.target.value) {
    event.stopPropagation();
    event.target.value = ""; state.q = ""; clearSearch(); render();
  }
});
document.getElementById("q").addEventListener("input", (event) => {
  state.q = event.target.value.trim().toLowerCase();
  render();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "/" && document.activeElement.id !== "q" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
    event.preventDefault();
    document.getElementById("q").focus();
  }
});
window.addEventListener("hashchange", () => {
  const v = viewFromHash();
  if (v && v !== state.view) go(v);
});
if (!location.hash) history.replaceState(null, "", "#home");
load().catch(err => {
  document.getElementById("main").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
});
</script>
</body>
</html>
